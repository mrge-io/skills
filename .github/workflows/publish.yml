name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Setup git config
        run: |
          git config --global user.email "cubic@cubic.dev"
          git config --global user.name "cubic"

      - name: Bump version
        run: |
          if [ -n "${VERSION}" ]; then
            npm version "${VERSION}"
          else
            npm version "${BUMP}"
          fi
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}

      - name: Run tests
        run: npm test

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Push version changes
        run: git push --atomic --follow-tags origin HEAD:${GITHUB_REF_NAME}

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
